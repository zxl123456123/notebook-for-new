<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f7f4e9" />
    <title>研究档案 · Du's Group</title>
    <link rel="stylesheet" href="archive.css" />
    <script defer src="archive-adapter.js"></script>
    <script defer src="archive.js"></script>
  </head>
  <body>
    <a class="skip" href="#archive">跳到档案</a>
    <header class="masthead">
      <a class="brand" href="index.html"
        ><span class="brand-mark" aria-hidden="true">D</span>课题组的书桌</a
      >

      <nav class="header-tools" aria-label="页面导航">
        <button
          id="open-sources"
          class="source-trigger"
          type="button"
          aria-label="管理文件来源"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 7h7l2 3h9v10H3zM3 7V4h7l2 3h9v3" /></svg
          ><span>文件来源</span>
        </button>
        <a class="home-link" href="index.html"
          >返回首页 <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main id="archive">
      <section class="intro">
        <div>
          <h1 id="collection-title">组会文件夹</h1>
          <p id="section-summary" class="section-summary">
            把每一次讨论，留在随手可翻的地方。
          </p>
        </div>
        <div class="preview-control">
          <button id="preview-toggle" type="button" aria-pressed="false">
            浏览示例 <span aria-hidden="true">↗</span>
          </button>
          <p id="preview-status" role="status" hidden>示例档案 · 虚构内容</p>
        </div>
      </section>
      <section class="shelf" aria-label="档案浏览">
        <div class="browse-bar">
          <div class="tabs" role="group" aria-label="档案分类">
            <button type="button" data-tab="meetings" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="4" y="5" width="16" height="16" rx="3" />
                <path d="M8 3v4m8-4v4M4 11h16m-11 4h3" /></svg
              >组会<span id="count-meetings"></span>
            </button>
            <button type="button" data-tab="resources" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 3h10l4 4v14H5zM14 3v5h5M9 12h6m-6 4h6" /></svg
              >资料库<span id="count-resources"></span>
            </button>
            <button type="button" data-tab="albums" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="3" />
                <circle cx="8" cy="9" r="1.5" />
                <path d="m3 17 6-5 4 3 3-3 5 5" /></svg
              >相册<span id="count-albums"></span>
            </button>
          </div>
          <span id="calendar-day" hidden>–</span>
          <div class="filters">
            <label class="search-field"
              ><span class="sr-only">搜索档案</span
              ><svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10.5" cy="10.5" r="6.5" />
                <path d="m16 16 5 5" /></svg
              ><input
                type="search"
                id="query"
                placeholder="搜索汇报人、论文题目或文件名"
            /></label>
            <label id="category-label" hidden
              ><span class="sr-only">资源分类</span
              ><select id="category">
                <option value="">全部分类</option>
              </select></label
            >
            <details id="date-filters" class="date-filters">
              <summary>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16M7 12h10m-7 6h4" /></svg
                ><span id="date-caption">日期</span
                ><span aria-hidden="true">⌄</span>
              </summary>
              <div class="date-panel">
                <div
                  id="date-reel"
                  class="date-reel"
                  role="group"
                  aria-label="有记录的日期"
                ></div>
                <div class="quick-dates">
                  <button type="button" data-range="30">近 30 天</button
                  ><button type="button" data-range="year">今年</button
                  ><button type="button" data-range="all">全部日期</button>
                </div>
                <details class="custom-range">
                  <summary>自定义范围</summary>
                  <div class="date-fields">
                    <label
                      >年份<select id="year">
                        <option value="">全部年份</option>
                      </select></label
                    ><label>从<input id="from" type="date" /></label
                    ><label>至<input id="until" type="date" /></label>
                  </div>
                </details>
              </div>
            </details>
            <button type="button" id="reset" title="清除全部筛选">重置</button>
          </div>
        </div>
        <p id="result-status" class="result-status" role="status"></p>
        <div id="results"></div>
        <aside id="empty" class="empty" aria-label="档案状态"></aside>
        <details id="issues" hidden>
          <summary>目录读取提示</summary>
          <ul id="issue-list"></ul>
        </details>
      </section>
    </main>
    <footer>
      <span>DU’S GROUP · 课题组的书桌</span><a href="index.html">回到书桌 ↗</a>
    </footer>
    <dialog id="archive-management" aria-labelledby="source-title">
      <div class="source-panel">
        <form method="dialog">
          <button class="close-source" aria-label="关闭文件来源">×</button>
        </form>
        <div class="source-symbol" aria-hidden="true">↗</div>

        <h2 id="source-title">连接研究档案</h2>

        <div class="folder">
          <label class="pick" for="folder"
            >选文件夹 <span aria-hidden="true">＋</span></label
          ><input id="folder" type="file" webkitdirectory multiple /><button
            type="button"
            class="refresh"
            id="refresh"
            hidden
          >
            刷新 ↻
          </button>
        </div>
        <p id="library-status" role="status">尚未选择文件夹</p>
        <p class="privacy" id="privacy">
          文件仅在当前页面读取，不会上传；刷新页面后需重新选择。
        </p>
      </div>
    </dialog>
    <dialog id="photo-viewer" aria-label="照片预览">
      <div class="photo-toolbar">
        <button id="previous" type="button" aria-label="上一张照片">
          ← 上一张
        </button>
        <p id="photo-caption"></p>
        <button id="next" type="button" aria-label="下一张照片">下一张 →</button
        ><button id="close-photo" type="button" aria-label="关闭照片预览">
          关闭 ×
        </button>
      </div>
      <img id="full-photo" alt="" />
      <div
        class="filmstrip"
        id="filmstrip"
        role="group"
        aria-label="选取照片"
      ></div>
      <p class="photo-help">← → 切换 · Esc 关闭</p>
    </dialog>

    <script>
      (() => {
        const dialog = document.getElementById("archive-management");
        document
          .getElementById("open-sources")
          .addEventListener("click", () => dialog.showModal());
        dialog.addEventListener("click", (event) => {
          if (event.target === dialog) {
            const box = dialog.getBoundingClientRect();
            if (
              event.clientX < box.left ||
              event.clientX > box.right ||
              event.clientY < box.top ||
              event.clientY > box.bottom
            )
              dialog.close();
          }
        });
        document.querySelectorAll("[data-range]").forEach((button) =>
          button.addEventListener("click", () => {
            const today = new Date();
            const date = (value) =>
              [
                value.getFullYear(),
                String(value.getMonth() + 1).padStart(2, "0"),
                String(value.getDate()).padStart(2, "0"),
              ].join("-");
            const start = new Date(today);
            start.setDate(start.getDate() - 29);
            const range = button.dataset.range;
            document.getElementById("year").value = "";
            document.getElementById("from").value =
              range === "30"
                ? date(start)
                : range === "year"
                  ? today.getFullYear() + "-01-01"
                  : "";
            document.getElementById("until").value =
              range === "all" ? "" : date(today);
            document
              .getElementById("from")
              .dispatchEvent(new Event("input", { bubbles: true }));
            document.getElementById("date-filters").open = false;
          }),
        );
        document.addEventListener("click", (event) => {
          const details = document.getElementById("date-filters");
          if (!details.contains(event.target)) details.open = false;
        });
        document
          .getElementById("date-filters")
          .addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
              event.currentTarget.open = false;
              event.currentTarget.querySelector("summary").focus();
            }
          });
      })();
    </script>
  </body>
</html>
